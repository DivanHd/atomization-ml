[project]
name = "atomization-ml"
version = "0.1.0"
description = "Прогнозирование энергии атомизации молекул"
requires-python = ">=3.10"
authors = [{ name = "M. Kulagin" }]

dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "scipy>=1.11.0",
    "joblib>=1.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src"]
